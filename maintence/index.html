<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A New Home for Azerbaijani Sculpture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;
  --ink:#e9e4d8;
  --muted:#8b8578;
  --gold:#c9a961;
  --line:rgba(201,169,97,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(201,169,97,.07), transparent 55%),
    radial-gradient(circle at 50% 100%, rgba(201,169,97,.05), transparent 55%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-weight:300;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:2rem;
  -webkit-font-smoothing:antialiased;
}
.frame{
  max-width:680px;
  width:100%;
  text-align:center;
  animation:fadeUp 1.4s cubic-bezier(.2,.7,.3,1) both;
}
.eyebrow{
  font-size:.7rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 2rem;
  font-weight:400;
}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:clamp(2.2rem,6vw,4rem);
  line-height:1.1;
  letter-spacing:-.01em;
  margin:0 0 1.75rem;
}
.divider{
  width:72px;
  height:1px;
  background:var(--line);
  margin:0 auto 1.75rem;
}
.message{
  color:var(--muted);
  font-size:1rem;
  line-height:1.75;
  max-width:520px;
  margin:0 auto 2.5rem;
}
.soon{
  font-size:.68rem;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--gold);
  opacity:.55;
  margin:0;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Museum of Sculpture</p>
    <h1>A New Home for Azerbaijani Sculpture</h1>
    <div class="divider"></div>
    <p class="message">We are carefully preparing a digital museum dedicated to the sculptural heritage of Azerbaijan — its monuments, their authors, and the stories behind them.</p>
    <p class="soon">Opening Soon</p>
  </main>
</body>
</html>
